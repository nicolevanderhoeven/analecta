name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e '.[dev]'
      - name: Tests
        run: pytest -q
      - name: Shell scripts
        run: shellcheck deploy/*.sh deploy/mac/*.sh scripts/*.sh .githooks/pre-commit

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Blocks tokens, keys, Discord IDs, IP addresses, e-mail addresses and denylisted names in every tracked file.
      # Optional: define a repository secret PRIVACY_DENYLIST (names separated by ';' or newlines) to also check
      # real names in CI. Without it CI still checks everything else; the pre-commit hook checks names locally.
      - name: Privacy check
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: python3 scripts/privacy_check.py --all
